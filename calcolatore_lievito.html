<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Calcolatore Lievitazione</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 20px;
            display: flex;
            justify-content: center;
            background-color: #f4f7f6;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border-left: 5px solid var(--primary-color, #e67e22);
            border-radius: 8px;
            line-height: 1.6;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 5px;
            background: #eee;
            border-radius: 8px;
        }

        .mode-selector label {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }

        .mode-selector input {
            display: none;
        }

        .mode-selector label:has(input:checked) {
            background: var(--primary-color);
            color: white;
        }

        .highlight {
            font-weight: bold;
            color: #d35400;
            font-size: 1.2rem;
        }

        .time-step {
            display: block;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .engine-badge {
            font-size: 0.7rem;
            background: #333;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            float: right;
        }
    </style>
</head>

<body>

    <div class="search-form-container">
        <div class="search-filters-content open">
            <h2 style="text-align: center; color: var(--primary-color);">Calcolatore Lievitazione</h2>

            <div class="mode-selector">
                <label><input type="radio" name="mode" value="lievito" checked onchange="toggleMode()"> Calcola
                    Lievito</label>
                <label><input type="radio" name="mode" value="tempo" onchange="toggleMode()"> Calcola Tempi</label>
            </div>

            <div class="search-flex">
                <div class="filter-group" style="flex:2">
                    <label>Tipo impasto</label>
                    <select id="impasto">
                        <option value="1.0">Pizza Napoletana</option>
                        <option value="1.2">Pane Classico</option>
                        <option value="1.5">Pizza in Teglia</option>
                        <option value="2.2">Impasti Grassi</option>
                    </select>
                </div>
                <div class="filter-group" style="flex:1">
                    <label>Farina (g)</label>
                    <input type="number" id="pesoFarina" value="1000">
                </div>
            </div>

            <div class="search-flex" style="margin-top:10px">
                <div class="filter-group" style="flex:1">
                    <label>Lievito</label>
                    <select id="tipoLievito">
                        <option value="fresco">Fresco</option>
                        <option value="secco">Secco</option>
                    </select>
                </div>
                <div class="filter-group" style="flex:1">
                    <label>Temperatura Ambiente (°C)</label>
                    <input type="number" id="temp" value="21">
                </div>
            </div>

            <div
                style="margin-top:15px; display:flex; flex-direction:row; align-items:center; gap:8px; flex-wrap:nowrap;">
                <input type="checkbox" id="frigo" onchange="updateEngineLabel()"
                    style="width:18px; height:18px; margin:0; flex-shrink:0; cursor:pointer;">

                <label for="frigo"
                    style="margin:0; white-space:nowrap; cursor:pointer; font-size:0.95rem; display:flex; align-items:center; gap:5px;">
                    <span style="font-weight:bold;">Uso Frigo</span>
                    <span style="color:#666; font-size:0.8rem;">(10%-70%-20%)</span>
                </label>

                <div style="font-size:0.8rem; color:#e67e22; white-space:nowrap; margin-left:5px;">
                    (consigliato >12h)
                </div>
            </div>
            <hr style="margin:20px 0; border:0; border-top:1px solid #ddd">

            <div class="search-flex">
                <div class="filter-group" id="group-ore" style="flex:1">
                    <label>Ore Totali</label>
                    <input type="number" id="ore" value="3">
                </div>
                <div class="filter-group" id="group-lievito" style="display:none; flex:1">
                    <label>Grammi Lievito</label>
                    <input type="number" id="lievitoInput" step="0.1" value="10">
                </div>
                <div class="filter-group" style="flex:1">
                    <label>Ora Cottura</label>
                    <input type="time" id="oraFine" value="20:00">
                </div>
            </div>

            <button class="btn-salva" style="width:100%; margin-top:20px" onclick="calcola()">ESEGUI CALCOLO</button>

            <div id="output" class="result-box" style="display:none"></div>
        </div>
    </div>

    <script>
        function toggleMode() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('group-ore').style.display = mode === 'lievito' ? 'block' : 'none';
            document.getElementById('group-lievito').style.display = mode === 'tempo' ? 'block' : 'none';
        }

        function calcola() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const farina = parseFloat(document.getElementById("pesoFarina").value);
            const temp = parseFloat(document.getElementById("temp").value);
            const impastoMult = parseFloat(document.getElementById("impasto").value);
            const isFrigo = document.getElementById("frigo").checked;
            const tipoLievito = document.getElementById("tipoLievito").value;
            const oraFine = document.getElementById("oraFine").value;

            let oreTotali, grammiLievito, engine;

            if (!isFrigo) {
                // --- MOTORE DIRETTO (Senza Frigo) ---
                // Basato su target: 10g / 3h / 1kg / 21°C
                engine = "DIRETTO";
                const K_DIRETTO = 63;
                const fTemp = Math.pow(1.1, temp - 21);

                if (mode === 'lievito') {
                    oreTotali = parseFloat(document.getElementById("ore").value);
                    let doseKg = (K_DIRETTO * impastoMult) / (oreTotali * fTemp);
                    grammiLievito = doseKg * (farina / 1000);
                } else {
                    grammiLievito = parseFloat(document.getElementById("lievitoInput").value);
                    let doseKg = (grammiLievito / farina) * 1000;
                    oreTotali = (K_DIRETTO * impastoMult) / (doseKg * fTemp);
                }
            } else {
                // --- MOTORE MATURAZIONE (Con Frigo) ---
                // Basato su target: 1.5g / 30h / 1kg / 21°C
                engine = "MATURAZIONE FRIGO";
                const K_FRIGO = 18;
                const fTemp = Math.pow(1.1, temp - 21);
                const effFrigo = (0.1 * 1 + 0.7 * 0.05 + 0.2 * 1); // Ciclo 10-70-20

                if (mode === 'lievito') {
                    oreTotali = parseFloat(document.getElementById("ore").value);
                    let doseKg = (K_FRIGO * impastoMult) / (oreTotali * effFrigo * fTemp);
                    grammiLievito = doseKg * (farina / 1000);
                } else {
                    grammiLievito = parseFloat(document.getElementById("lievitoInput").value);
                    let doseKg = (grammiLievito / farina) * 1000;
                    oreTotali = (K_FRIGO * impastoMult) / (doseKg * effFrigo * fTemp);
                }
            }

            if (tipoLievito === 'secco') {
                if (mode === 'lievito') grammiLievito /= 3;
                else oreTotali *= 1; // Il calcolo sopra usa già il parametro corretto
            }

            mostra(oreTotali, grammiLievito, tipoLievito, isFrigo, oraFine, farina, engine);
        }

        function mostra(ore, grammi, tipo, isFrigo, oraFine, farina, engine) {
            const out = document.getElementById("output");
            out.style.display = "block";
            const d = new Date();
            const [h, m] = oraFine.split(':');
            let target = new Date(); target.setHours(h, m, 0);
            if (target < d) target.setDate(target.getDate() + 1);
            let inizio = new Date(target.getTime() - (ore * 3600000));

            let html = `<span class="engine-badge">${engine}</span>`;
            html += `<strong>PER ${farina}g DI FARINA:</strong><br>`;
            html += `Lievito ${tipo}: <span class="highlight">${grammi.toFixed(1)}g</span><br>`;
            html += `Tempo Totale: <span class="highlight">${ore.toFixed(1)} ore</span><br><br>`;
            html += `<span class="time-step">📅 <b>Inizio:</b> ${inizio.toLocaleString('it-IT', { hour: '2-digit', minute: '2-digit' })}</span>`;

            if (isFrigo) {
                let orea1 = ore * 0.1;
                let oref = ore * 0.7;
                let orea2 = ore * 0.2;
                let f1 = new Date(inizio.getTime() + (orea1 * 3600000));
                let f2 = new Date(f1.getTime() + (oref * 3600000));
                html += `<span class="time-step">🌡️ Ambiente ${orea1.toFixed(1)} ore - fino alle ${f1.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
                html += `<span class="time-step">❄️ Frigo ${oref.toFixed(1)} ore - fino alle ${f2.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
                html += `<span class="time-step">🍕 Ambiente ${orea2.toFixed(1)} ore - fino alle ${target.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
            }
            out.innerHTML = html;
        }
    </script>

</body>

</html>
